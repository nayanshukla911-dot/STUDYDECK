<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyDeck – PPT organiser & revision calendar</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#17233b;--mute:#667085;--line:#dde2ea;--acc:#0f766e;--acc-ink:#fff;--warn:#fde68a;--warn-ink:#713f12;--bad:#fecaca;--bad-ink:#7f1d1d;--ok:#bbf7d0;--ok-ink:#14532d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--panel:#18223a;--ink:#e8edf7;--mute:#9aa7bf;--line:#2b3856;--acc:#2dd4bf;--acc-ink:#042f2e;--warn:#5b4a12;--warn-ink:#fde68a;--bad:#5f1d1d;--bad-ink:#fecaca;--ok:#14532d;--ok-ink:#bbf7d0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.ghost{border:none;background:none;padding:2px 6px;color:var(--mute)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--ink);color:#fff}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
.stats{display:flex;gap:20px;font-size:13px;opacity:.9}.stats b{font-size:18px;display:block}
nav{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 16px}
nav button.on{border-color:var(--acc);font-weight:600}
nav .sp{flex:1}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:20px 24px;max-width:1300px;margin:auto}
.one{grid-template-columns:1fr}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.semh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:10px}
.sub{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;margin:2px 0;border-radius:8px;cursor:pointer;border-left:4px solid var(--c)}
.sub:hover{background:var(--bg)}.sub.on{background:var(--bg);font-weight:600}
.mute{color:var(--mute);font-size:13px}
.ppt{margin-bottom:14px}
.ppt h3{margin:0;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:999px;font-size:13px;padding:3px 11px}
.chip.done{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.chip.over{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.chip.due{background:var(--warn);color:var(--warn-ink);border-color:transparent}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:13px;padding:4px}
.day{min-height:68px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between}
.day.out{opacity:.4}.day.t{border-color:var(--acc);border-width:2px}.day.sel{background:var(--bg)}
.badge{align-self:flex-end;font-size:12px;padding:0 8px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.badge.o{background:var(--bad);color:var(--bad-ink)}.badge.d{background:var(--ok);color:var(--ok-ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:none}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
h2{margin:0 0 10px;font-size:18px}
</style>
</head>
<body>
<header>
  <h1>StudyDeck</h1>
  <div class="stats" id="stats"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<dialog id="dlg">
  <h2>Add PPT</h2>
  <label for="f-title">Title</label><input id="f-title" placeholder="e.g. Unit 3 – Process Scheduling">
  <label for="f-topic">Unit / topic (optional)</label><input id="f-topic" placeholder="e.g. Operating Systems, Unit 3">
  <label for="f-date">Date you studied it</label><input id="f-date" type="date">
  <label for="f-file">PPT file (optional – saved inside this app)</label><input id="f-file" type="file" accept=".ppt,.pptx,.pdf,.odp">
  <div class="row" style="margin-top:18px;justify-content:flex-end">
    <button id="f-cancel">Cancel</button><button class="pri" id="f-save">Save PPT</button>
  </div>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const COLORS = ["#0f766e","#2563eb","#9333ea","#db2777","#ea580c","#65a30d","#0891b2","#ca8a04"];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const today = () => fmt(new Date());
const nice = s => parse(s).toLocaleDateString("en-IN", {day:"numeric", month:"short"});

/* ---------- storage ---------- */
let S = { sems: [], subs: [], ppts: [], intervals: [1,3,7,14,30] };
try { const raw = localStorage.getItem("studydeck"); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem("studydeck", JSON.stringify(S)); } catch (e) { alert("Could not save – browser storage is blocked."); } };

let dbp;
const db = () => dbp ||= new Promise((res, rej) => {
  const r = indexedDB.open("studydeck-files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("f");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const fileOp = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("f", mode); const q = fn(t.objectStore("f")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
const putFile = (id, blob) => fileOp("readwrite", s => s.put(blob, id));
const getFile = id => fileOp("readonly", s => s.get(id));
const delFile = id => fileOp("readwrite", s => s.delete(id));

/* ---------- state ---------- */
let view = "library", selSem = null, selSub = null, calMonth = new Date(), calDay = today();
calMonth.setDate(1);

const revsFor = (date) => S.intervals.map(n => ({ date: addDays(date, n), done: false, n }));
const allRevs = () => S.ppts.flatMap(p => p.revs.map((r, i) => ({ p, r, i })));
const subOf = p => S.subs.find(s => s.id === p.subId);

/* ---------- render ---------- */
function render() {
  const all = allRevs(), t = today();
  const due = all.filter(x => !x.r.done && x.r.date <= t).length;
  const done = all.filter(x => x.r.done).length;
  $("#stats").innerHTML =
    `<div><b>${S.ppts.length}</b>PPTs</div><div><b>${due}</b>revisions due</div><div><b>${all.length ? Math.round(done/all.length*100) : 0}%</b>revised</div>`;
  const tabs = [["library","Library"],["today","Today" + (due ? ` (${due})` : "")],["calendar","Calendar"]];
  $("#nav").innerHTML = tabs.map(([k,l]) => `<button class="${view===k?"on":""}" data-act="view" data-id="${k}">${l}</button>`).join("") +
    `<span class="sp"></span><button data-act="settings">Revision gaps</button><button data-act="export">Backup</button><button data-act="import">Restore</button>`;
  $("#main").innerHTML = view === "library" ? libraryView() : view === "today" ? todayView() : calendarView();
}

function chip(p, r, i) {
  const t = today();
  const cls = r.done ? "done" : r.date < t ? "over" : r.date === t ? "due" : "";
  return `<button class="chip ${cls}" title="Click to mark done / undo" data-act="tog" data-id="${p.id}" data-i="${i}">${r.done ? "✓ " : ""}Day ${r.n} · ${nice(r.date)}</button>`;
}

function libraryView() {
  const side = S.sems.map(se => `
    <div class="semh"><span>${esc(se.name)}</span><span>
      <button class="ghost" title="Add subject" data-act="addsub" data-id="${se.id}">+ Subject</button>
      <button class="ghost" title="Rename" data-act="rensem" data-id="${se.id}">Rename</button>
      <button class="ghost" title="Delete" data-act="delsem" data-id="${se.id}">Delete</button></span></div>` +
    S.subs.filter(s => s.semId === se.id).map(s => `
      <div class="sub ${selSub===s.id?"on":""}" style="--c:${s.color}" data-act="selsub" data-id="${s.id}">
        <span>${esc(s.name)}</span><span class="mute">${S.ppts.filter(p => p.subId===s.id).length}</span></div>`).join("") ||
    "").join("");
  const sub = S.subs.find(s => s.id === selSub);
  let main;
  if (!S.sems.length) main = `<div class="card empty">Start by adding your first semester.</div>`;
  else if (!sub) main = `<div class="card empty">Pick a subject on the left, or add one with “+ Subject”.</div>`;
  else {
    const list = S.ppts.filter(p => p.subId === sub.id);
    main = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">${esc(sub.name)}</h2>
      <span><button data-act="delsub" data-id="${sub.id}">Delete subject</button> <button class="pri" data-act="addppt">+ Add PPT</button></span></div>` +
      (list.length ? list.map(p => {
        const d = p.revs.filter(r => r.done).length;
        return `<div class="card ppt">
          <div class="row"><div><h3>${esc(p.title)}</h3><div class="mute">${p.topic ? esc(p.topic) + " · " : ""}Studied ${nice(p.date)}${p.fileName ? " · " + esc(p.fileName) : ""}</div></div>
          <span>${p.fileId ? `<button data-act="open" data-id="${p.id}">Open file</button>` : ""}
          <button data-act="delppt" data-id="${p.id}">Remove</button></span></div>
          <div class="chips">${p.revs.map((r,i) => chip(p, r, i)).join("")}</div>
          <div class="bar"><i style="width:${p.revs.length ? d/p.revs.length*100 : 0}%"></i></div></div>`;
      }).join("") : `<div class="card empty">No PPTs here yet. Add one to schedule its revisions automatically.</div>`);
  }
  return `<div class="wrap"><aside class="side"><div class="row"><b>Semesters</b><button class="pri" data-act="addsem">+ Semester</button></div>${side || `<p class="mute">No semesters yet.</p>`}</aside><section>${main}</section></div>`;
}

function itemRow(x, showDate) {
  const sub = subOf(x.p);
  return `<div class="item"><div><b>${esc(x.p.title)}</b><div class="mute">${sub ? esc(sub.name) + " · " : ""}Day ${x.r.n}${showDate ? " · " + nice(x.r.date) : ""}</div></div>
    <span>${x.p.fileId ? `<button data-act="open" data-id="${x.p.id}">Open</button> ` : ""}<button class="${x.r.done?"":"pri"}" data-act="tog" data-id="${x.p.id}" data-i="${x.i}">${x.r.done ? "Undo" : "Mark revised"}</button></span></div>`;
}

function todayView() {
  const t = today(), all = allRevs().filter(x => !x.r.done);
  const over = all.filter(x => x.r.date < t), now = all.filter(x => x.r.date === t);
  const soon = all.filter(x => x.r.date > t && x.r.date <= addDays(t, 7)).sort((a,b) => a.r.date.localeCompare(b.r.date));
  const sec = (title, arr, sd) => `<div class="card" style="margin-bottom:16px"><h2>${title}</h2>${arr.length ? arr.map(x => itemRow(x, sd)).join("") : `<div class="mute">Nothing here.</div>`}</div>`;
  return `<div class="wrap one">${sec("Overdue", over, true)}${sec("Due today", now, false)}${sec("Coming up this week", soon, true)}</div>`;
}

function calendarView() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), t = today();
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
  const map = {};
  allRevs().forEach(x => (map[x.r.date] ||= []).push(x));
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = fmt(d), L = map[k] || [];
    const pend = L.filter(x => !x.r.done).length;
    const cls = L.length ? (pend ? (k < t ? "o" : "") : "d") : "";
    cells += `<button class="day ${d.getMonth()!==m?"out":""} ${k===t?"t":""} ${k===calDay?"sel":""}" data-act="day" data-id="${k}">
      <span>${d.getDate()}</span>${L.length ? `<span class="badge ${cls}">${pend ? pend + " due" : "✓ " + L.length}</span>` : ""}</button>`;
  }
  const sel = (map[calDay] || []);
  return `<div class="wrap one"><div class="card">
    <div class="row" style="margin-bottom:10px"><h2 style="margin:0">${calMonth.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h2>
    <span><button data-act="prev">‹ Prev</button> <button data-act="now">Today</button> <button data-act="next">Next ›</button></span></div>
    <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div></div>
    <div class="card" style="margin-top:16px"><h2>${parse(calDay).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}</h2>
    ${sel.length ? sel.map(x => itemRow(x, false)).join("") : `<div class="mute">No revisions scheduled on this day.</div>`}</div></div>`;
}

/* ---------- actions ---------- */
const dlg = $("#dlg");
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "view") view = id;
  else if (act === "addsem") { const n = prompt("Semester name (e.g. Semester 3)"); if (!n || !n.trim()) return; const se = {id: uid(), name: n.trim()}; S.sems.push(se); selSem = se.id; }
  else if (act === "rensem") { const se = S.sems.find(s => s.id === id), n = prompt("Rename semester", se.name); if (n && n.trim()) se.name = n.trim(); }
  else if (act === "delsem") {
    if (!confirm("Delete this semester with all its subjects and PPTs?")) return;
    for (const s of S.subs.filter(s => s.semId === id)) await removeSubject(s.id);
    S.sems = S.sems.filter(s => s.id !== id);
  }
  else if (act === "addsub") { const n = prompt("Subject name"); if (!n || !n.trim()) return; const s = {id: uid(), semId: id, name: n.trim(), color: COLORS[S.subs.length % COLORS.length]}; S.subs.push(s); selSub = s.id; }
  else if (act === "selsub") selSub = id;
  else if (act === "delsub") { if (!confirm("Delete this subject and its PPTs?")) return; await removeSubject(id); }
  else if (act === "addppt") { $("#f-title").value = ""; $("#f-topic").value = ""; $("#f-file").value = ""; $("#f-date").value = today(); dlg.showModal(); return; }
  else if (act === "delppt") { if (!confirm("Remove this PPT and its revision schedule?")) return; const p = S.ppts.find(p => p.id === id); if (p.fileId) await delFile(p.fileId); S.ppts = S.ppts.filter(p => p.id !== id); }
  else if (act === "tog") { const r = S.ppts.find(p => p.id === id).revs[+b.dataset.i]; r.done = !r.done; }
  else if (act === "open") {
    const p = S.ppts.find(p => p.id === id), blob = await getFile(p.fileId);
    if (!blob) return alert("File not found in this app's storage.");
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = p.fileName; a.target = "_blank"; a.click(); return;
  }
  else if (act === "day") { calDay = id; }
  else if (act === "prev") calMonth.setMonth(calMonth.getMonth() - 1);
  else if (act === "next") calMonth.setMonth(calMonth.getMonth() + 1);
  else if (act === "now") { calMonth = new Date(); calMonth.setDate(1); calDay = today(); }
  else if (act === "settings") {
    const v = prompt("Days after studying when you want to revise (comma separated).\nApplies to PPTs you add from now on.", S.intervals.join(", "));
    if (v) { const n = v.split(",").map(x => parseInt(x)).filter(x => x > 0); if (n.length) S.intervals = n; }
  }
  else if (act === "export") {
    const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "studydeck-backup-" + today() + ".json"; a.click(); return;
  }
  else if (act === "import") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = async () => { try { const d = JSON.parse(await inp.files[0].text()); if (!d.sems || !d.subs || !d.ppts) throw 0; if (!confirm("Replace current data with this backup? (PPT files themselves are not included in backups.)")) return; S = Object.assign(S, d); save(); render(); } catch (e) { alert("That file is not a valid StudyDeck backup."); } };
    inp.click(); return;
  }
  save(); render();
});

async function removeSubject(id) {
  for (const p of S.ppts.filter(p => p.subId === id)) if (p.fileId) await delFile(p.fileId);
  S.ppts = S.ppts.filter(p => p.subId !== id);
  S.subs = S.subs.filter(s => s.id !== id);
  if (selSub === id) selSub = null;
}

$("#f-cancel").onclick = () => dlg.close();
$("#f-save").onclick = async () => {
  const title = $("#f-title").value.trim(), date = $("#f-date").value || today();
  if (!title) return $("#f-title").focus();
  const p = {id: uid(), subId: selSub, title, topic: $("#f-topic").value.trim(), date, revs: revsFor(date)};
  const f = $("#f-file").files[0];
  if (f) { try { p.fileId = uid(); p.fileName = f.name; await putFile(p.fileId, f); } catch (e) { delete p.fileId; delete p.fileName; alert("The file could not be stored, but the PPT entry was saved."); } }
  S.ppts.push(p); save(); dlg.close(); render();
};

render();
</script>
</body>
</html>
